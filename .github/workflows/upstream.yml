name: Upstream process (force PR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: main
  UPSTREAM_OWNER: aws-samples
  UPSTREAM_REPO: iam-identity-center-team

jobs:
  upstream:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Configure git identity
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Add upstream remote and fetch tags
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git || true
          git fetch upstream --tags

      # 4️⃣ Determine the tag to sync
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Triggered by tag push: $TAG"
          else
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
            echo "Triggered manually, using latest tag: $TAG"
          fi

          if [ -z "$TAG" ]; then
            echo "No v* tags found"
            exit 1
          fi

          echo "Resolved tag is: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 5️⃣ Get upstream tag commit SHA
      - name: Get upstream tag commit SHA
        id: upstream_commit
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          COMMIT_SHA=$(git rev-parse "refs/tags/${TAG}")
          if [ -z "$COMMIT_SHA" ]; then
            echo "Commit for upstream tag $TAG not found"
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      # 6️⃣ Check if branch exists
      - name: Check if branch exists
        id: check
        run: |
          BRANCH="upstream/${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 7️⃣ Create branch from main and merge upstream tag commit (force PR)
      - name: Create branch and merge upstream tag
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          COMMIT=${{ steps.upstream_commit.outputs.commit_sha }}
          BRANCH="upstream/${TAG}"

          echo "Creating branch $BRANCH from main and merging upstream tag commit $COMMIT"
          git checkout origin/${BASE_BRANCH} -b "$BRANCH"
          git merge "$COMMIT" --allow-unrelated-histories -m "Sync upstream tag ${TAG}" || true

      # 8️⃣ Restore workflows to prevent push errors
      - name: Restore workflows
        if: steps.check.outputs.exists == 'false'
        run: |
          git checkout origin/${BASE_BRANCH} -- .github/workflows || true

      # 9️⃣ Commit restored workflows if needed
      - name: Commit restored workflows
        if: steps.check.outputs.exists == 'false'
        run: |
          git add .github/workflows
          git commit -m "Restore local workflows from ${BASE_BRANCH}" || true

      # 🔟 Push branch (force)
      - name: Push branch
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          echo "Pushing branch upstream/${TAG} to origin"
          git push origin "upstream/${TAG}" --force

      # 1️⃣1️⃣ Create Pull Request
      - name: Create Pull Request
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SECRET }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          echo "Creating PR for branch upstream/${TAG}"
          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "upstream/${TAG}" \
            --title "Sync upstream tag ${TAG}" \
            --body "Automated PR syncing upstream tag **${TAG}** from ${UPSTREAM_OWNER}/${UPSTREAM_REPO}"
