name: Sync upstream tag and open PR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: main
  UPSTREAM_OWNER: aws-samples
  UPSTREAM_REPO: iam-identity-center-team

jobs:
  sync-tag:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Configure Git identity for commits
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Add upstream remote and fetch tags
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git || true
          git fetch upstream --tags

      # 4️⃣ Extract tag name from push or pick latest v* tag
      - name: Resolve tag to use
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Triggered by tag push: $TAG"
          else
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
            echo "Triggered manually, using latest tag: $TAG"
          fi

          if [ -z "$TAG" ]; then
            echo "No v* tags found"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 5️⃣ Verify tag exists in upstream
      - name: Verify tag exists in upstream
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git show-ref --tags --verify --quiet "refs/tags/$TAG"

      # 6️⃣ Check if branch already exists
      - name: Check if branch exists
        id: check
        run: |
          BRANCH="upstream/${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 7️⃣ Create branch from upstream tag
      - name: Create branch from upstream tag
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          BRANCH="upstream/${TAG}"
          git checkout -b "$BRANCH" "refs/tags/$TAG"

      # 8️⃣ Restore local workflows to prevent GitHub push errors
      - name: Restore local workflows from main
        if: steps.check.outputs.exists == 'false'
        run: |
          git checkout origin/${BASE_BRANCH} -- .github/workflows || true

      # 9️⃣ Commit restored workflows
      - name: Commit restored workflows
        if: steps.check.outputs.exists == 'false'
        run: |
          git add .github/workflows
          git commit -m "Restore local workflows from ${BASE_BRANCH}" || true

      # 🔟 Push branch to origin
      - name: Push branch
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git push origin "upstream/${TAG}"

      # 1️⃣1️⃣ Create Pull Request
      - name: Create Pull Request
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SECRET }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "upstream/${TAG}" \
            --title "Sync upstream tag ${TAG}" \
            --body "Automated PR syncing upstream tag **${TAG}** from ${UPSTREAM_OWNER}/${UPSTREAM_REPO}"
