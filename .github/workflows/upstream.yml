name: Sync upstream tag and open PR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: main
  UPSTREAM_OWNER: aws-samples
  UPSTREAM_REPO: iam-identity-center-team

jobs:
  sync-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git || true
          git fetch upstream --tags

      - name: Resolve tag to use (push or manual)
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          fi

          if [ -z "$TAG" ]; then
            echo "No v* tags found"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists in upstream
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git show-ref --tags --verify --quiet "refs/tags/$TAG"

      - name: Check if branch already exists
        id: check
        run: |
          BRANCH="upstream/${{ steps.tag.outputs.tag }}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch from upstream tag
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git checkout -b "upstream/${TAG}" "refs/tags/$TAG"

      # 🔐 SAFE WORKFLOW RESTORE (key fix)
      - name: Restore local workflows from main
        if: steps.check.outputs.exists == 'false'
        run: |
          git checkout origin/${BASE_BRANCH} -- .github/workflows || true
          git add .github/workflows
          git commit -m "Restore local workflows from ${BASE_BRANCH}" || true

      - name: Push branch
        if: steps.check.outputs.exists == 'false'
        run: |
          git push origin "upstream/${{ steps.tag.outputs.tag }}"

      - name: Create Pull Request
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "upstream/${{ steps.tag.outputs.tag }}" \
            --title "Sync upstream tag ${{ steps.tag.outputs.tag }}" \
            --body "Automated PR syncing upstream tag **${{ steps.tag.outputs.tag }}** from ${UPSTREAM_OWNER}/${UPSTREAM_REPO}"
