name: Sync upstream tag and open PR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: main
  UPSTREAM_OWNER: aws-samples
  UPSTREAM_REPO: iam-identity-center-team

jobs:
  sync-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git || true
          git fetch upstream --tags

      - name: Extract tag name
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists in upstream
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git show-ref --tags --verify --quiet "refs/tags/$TAG"

      - name: Check if branch already exists
        id: check
        run: |
          BRANCH="upstream/${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch from upstream tag
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          BRANCH="upstream/${TAG}"

          git checkout -b "$BRANCH" "refs/tags/$TAG"

      # 🔒 CRITICAL SECURITY STEP (prevents workflow permission error)
      - name: Restore local workflows from main
        if: steps.check.outputs.exists == 'false'
        run: |
          git checkout origin/${BASE_BRANCH} -- .github/workflows || true

      - name: Commit restored workflows
        if: steps.check.outputs.exists == 'false'
        run: |
          git add .github/workflows
          git commit -m "Restore local workflows from ${BASE_BRANCH}" || true

      - name: Push branch to origin
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git push origin "upstream/${TAG}"

      - name: Create Pull Request
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "upstream/${TAG}" \
            --title "Sync upstream tag ${TAG}" \
            --body "Automated PR syncing upstream tag **${TAG}** from ${UPSTREAM_OWNER}/${UPSTREAM_REPO}"
