name: Sync upstream release and open PR

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

env:
  UPSTREAM_OWNER: aws-samples/iam-identity-center-team
  UPSTREAM_REPO: quivo-datami/team-idc-app
  BASE_BRANCH: main

jobs:
  sync-upstream-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(curl -s \
            https://api.github.com/repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/releases/latest \
            | jq -r .tag_name)

          if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
            echo "No upstream release found"
            exit 0
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists locally
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.upstream.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add upstream remote
        if: steps.check.outputs.exists == 'false'
        run: |
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git
          git fetch upstream --tags

      - name: Create branch from upstream tag
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          BRANCH=upstream/${TAG}

          git checkout -b "$BRANCH" "refs/tags/$TAG"
          git push origin "$BRANCH"

      - name: Create Pull Request
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          BRANCH=upstream/${TAG}

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "$BRANCH" \
            --title "Sync upstream release ${TAG}" \
            --body "Automated PR syncing upstream release **${TAG}** from ${UPSTREAM_OWNER}/${UPSTREAM_REPO}"
