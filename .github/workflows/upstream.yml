name: Upstream process

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: main
  UPSTREAM_OWNER: aws-samples
  UPSTREAM_REPO: iam-identity-center-team

jobs:
  sync-tag:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repo
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Configure git identity for commits
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3️⃣ Add upstream remote and fetch tags
      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git || true
          git fetch upstream --tags

      # 4️⃣ Resolve tag to use
      - name: Resolve tag to use
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Triggered by tag push: $TAG"
          else
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
            echo "Triggered manually, using latest tag: $TAG"
          fi

          if [ -z "$TAG" ]; then
            echo "No v* tags found"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 5️⃣ Get upstream tag commit SHA
      - name: Get upstream tag commit SHA
        id: upstream_commit
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          COMMIT_SHA=$(git rev-parse "refs/tags/${TAG}")
          if [ -z "$COMMIT_SHA" ]; then
            echo "Commit for upstream tag $TAG not found"
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      # 6️⃣ Check if branch already exists
      - name: Check if branch exists
        id: check
        run: |
          BRANCH="upstream/${{ steps.tag.outputs.tag }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 7️⃣ Create branch from main and cherry-pick upstream tag commit
      - name: Create branch and cherry-pick upstream commit
        if: steps.check.outputs.exists == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          COMMIT=${{ steps.upstream_commit.outputs.commit_sha }}
          BRANCH="upstream/${TAG}"

          git checkout origin/${BASE_BRANCH} -b "$BRANCH"
          git cherry-pick "$COMMIT" || true  # trivial conflicts ignored

      # 8️⃣ Restore local workflows to avoid push restrictions
      - name: Restore local workflows from main
        if: steps.check.outputs.exists == 'false'
        run: |
          git checkout origin/${BASE_BRANCH} -- .github/workflows || true

      # 9️⃣ Commit restored workflows (if needed)
      - name: Commit restored workflows
        if: steps.check.outputs.exists == 'false'
        run: |
          git add .github/workflows
          git commit -m "Restore local workflows from ${BASE_BRANCH}" || true

      # 🔟 Check if there are new commits to push
      - name: Check for new commits
        id: has_commits
        if: steps.check.outputs.exists == 'false'
        run: |
          NEW_COMMITS=$(git log origin/${BASE_BRANCH}..HEAD --oneline)
          if [ -z "$NEW_COMMITS" ]; then
            echo "no_new_commits=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_new_commits=false" >> "$GITHUB_OUTPUT"
          fi

      # 1️⃣1️⃣ Push branch to origin if there are commits
      - name: Push branch
        if: steps.check.outputs.exists == 'false' && steps.has_commits.outputs.no_new_commits == 'false'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git push origin "upstream/${TAG}"

      # 1️⃣2️⃣ Create Pull Request if commits exist
      - name: Create Pull Request
        if: steps.check.outputs.exists == 'false' && steps.has_commits.outputs.no_new_commits == 'false'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SECRET }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "upstream/${TAG}" \
            --title "Sync upstream tag ${TAG}" \
            --body "Automated PR syncing upstream tag **${TAG}** from ${UPSTREAM_OWNER}/${UPSTREAM_REPO}"
